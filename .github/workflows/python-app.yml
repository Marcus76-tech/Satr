name: Satr - Build Blocklist

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Satr source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Satr
        run: python main.py

      - name: Save generated hosts list
        uses: actions/upload-artifact@v4
        with:
          name: satr-hosts
          path: dist/satr-hosts.txt

      - name: Save browser extension rules
        uses: actions/upload-artifact@v4
        with:
          name: satr-extension-rules
          path: extension/rules.json
